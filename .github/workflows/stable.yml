name: stable

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: stable-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Build
        run: |
          chmod +x ./gradlew
          ./gradlew build

      - name: Extract version
        id: version
        run: |
          sed -n 's/^version=/version=/p; s/^minecraftVersion=/minecraft_version=/p' gradle.properties | tr -d '\r' >> "$GITHUB_OUTPUT"

      - name: Generate changelog
        if: github.event_name == 'push'
        uses: dsx137/generate-changelog@main
        id: changelog
        with:
          branch: ${{ github.ref_name }}
          exclude: snapshot

      - name: Create GitHub release
        if: github.event_name == 'push'
        uses: andelf/nightly-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: ${{ steps.version.outputs.version }}
          prerelease: false
          body: ${{ steps.changelog.outputs.changelog }}
          files: build/libs/SimpleHealth-${{ steps.version.outputs.version }}-all.jar

      - name: Publish to Modrinth
        if: github.event_name == 'push'
        uses: dsx137/modrinth-releaser@main
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
        with:
          project_id: ${{ vars.MODRINTH_PROJECT_ID }}
          name: ${{ steps.version.outputs.version }}
          version_number: ${{ steps.version.outputs.version }}
          version_type: release
          changelog: ${{ steps.changelog.outputs.changelog }}
          loaders: paper
          game_versions: ${{ steps.version.outputs.minecraft_version }}
          files: build/libs/SimpleHealth-${{ steps.version.outputs.version }}-all.jar
